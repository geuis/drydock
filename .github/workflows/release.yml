name: Release

# Runs only when a version tag like v0.2.0 is pushed. Tags can only be pushed
# by people with write access, so signing secrets are never exposed to forks.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags, so the release notes can list every
          # commit since the previous release.
          fetch-depth: 0

      - name: Run tests
        run: swift test --disable-swift-testing

      - name: Import signing certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"

          # The keychain only lives for this run, so a random password is enough.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Lets codesign use the key without a GUI password prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          rm "$CERT_PATH"

      - name: Write notarization key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"

      - name: Build, sign, and notarize
        env:
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          Tools/build-app.sh --version "$VERSION" --build-number "$GITHUB_RUN_NUMBER" --notarize

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_PATH="$RUNNER_TEMP/release-notes.md"

          Tools/release-notes.sh "$GITHUB_REF_NAME" > "$NOTES_PATH"

          gh release create "$GITHUB_REF_NAME" "dist/Drydock-$VERSION.dmg" \
            --title "Drydock $VERSION" \
            --notes-file "$NOTES_PATH"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"
